# Pipeline fuer HACS*lab.
#
# Zwei Dinge werden geprueft, die man leicht schleifen laesst:
# der Kern muss ohne Home Assistant importierbar bleiben, und in den
# Tests darf keine Netzanfrage stecken. Beides faellt sonst erst auf,
# wenn es teuer ist.

.ueberall: &ueberall
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # Stufe M10: Tag-Pipelines existieren fuer die Auslieferung. Die
    # Alltag-Jobs oben bleiben unberuehrt -- ihre Regeln greifen nur
    # fuer Zweige und Merge Requests, ein Tag loest sie nicht aus.
    - if: $CI_COMMIT_TAG

stages:
  - form
  - test
  - grenzen
  - auslieferung

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements-dev.txt

# --------------------------------------------------------------------
form:
  <<: *ueberall
  stage: form
  script:
    - ruff check .
    - ruff format --check .

tests:
  <<: *ueberall
  stage: test
  variables:
    PYTHONUTF8: "1"
  script:
    - python -m pytest -q

# Die Home-Assistant-Bahn: eigene Umgebung, eigener Job. Der Grund
# ist doppelt -- Home Assistant 2025.2 verlangt Python 3.13, und seine
# Installation wiegt ein paar Minuten. Kern und Waechter bleiben
# schlank; dieses File hier (requirements-ha.txt) ist der einzige
# Ort, an dem beide Pakete zusammengehoeren.
# Das VOLLE python:3.13-Image ist Absicht: slim hat keinen gcc, und
# lru-dict (Home-Assistant-Abhaengigkeit, C-Erweiterung) baut sonst
# nicht -- derselbe Sturz wie einst im alten hacs-lab (Flug 0643 dort).
tests-homeassistant:
  <<: *ueberall
  stage: test
  image: python:3.13
  variables:
    PYTHONUTF8: "1"
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements-ha.txt
  script:
    - python -m pytest tests_ha -q -p pytest_homeassistant_custom_component

# --------------------------------------------------------------------
# Der Kern haengt nicht an Home Assistant. Das ist keine Stilfrage:
# nur so bleiben die Tests schnell und ohne HA-Installation lauffaehig.
kern-ohne-homeassistant:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - python -c "import hacs_lab.core.entdeckung, hacs_lab.core.gitlab_forge, hacs_lab.core.versionen; print('Kern importiert ohne Home Assistant')"
    - |
      if grep -rn "import homeassistant\|from homeassistant" hacs_lab/; then
        echo "FEHLER: Home Assistant im Kern -- das gehoert nach custom_components/"
        exit 1
      fi
      echo "kein Home-Assistant-Import im Kern"

# Anbieterwissen gehoert hinter die Forge-Schnittstelle. Ein Sonderpfad
# im Ablauf faellt hier auf, solange er noch billig zu entfernen ist.
kein-anbieter-sonderpfad:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - |
      # Gesucht ist echter Code, keine Erwaehnung der Regel. Zeilen mit
      # ``...`` sind Dokumentation und zaehlen nicht.
      treffer=$(grep -rnE 'if .*provider *== *"(gitlab|github)"' \
        --include="*.py" hacs_lab/ custom_components/ \
        | grep -v '``' \
        | grep -v "hacs_lab/core/gitlab_forge.py" || true)
      if [ -n "$treffer" ]; then
        echo "$treffer"
        echo "FEHLER: Anbieter-Sonderpfad ausserhalb der Anbieterklasse"
        exit 1
      fi
      echo "kein Sonderpfad gefunden"

# Kein Test darf ins Netz greifen, und die Privatinstanz hat in
# Testdaten nichts verloren. Ein Hostname als reine Zeichenkette
# ("gitlab.com") ist dagegen in Ordnung -- er ruft niemanden an.
tests-ohne-netz:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - |
      if grep -rnE "import (aiohttp|requests|httpx|socket|urllib)|requests\.(get|post)" tests/ tests_ha/; then
        echo "FEHLER: Netzzugriff in den Tests"
        exit 1
      fi
      if grep -rn "ipv64\.net" tests/ tests_ha/; then
        echo "FEHLER: Privatinstanz in den Testdaten"
        exit 1
      fi
      echo "Tests bleiben trocken"

# --------------------------------------------------------------------
# Stufe M10 -- Nach draussen. Beide Jobs laufen NUR auf Tags; die
# Alltag-Pipeline (Zweige, Merge Requests) bleibt unberuehrt.
#
# auslieferung baut den ZIP deterministisch aus dem ausgecheckten
# Stand (reine Standardbibliothek -- darum ohne pip-Installation) und
# meldet Name, Adresse und Fingerabdruck per dotenv an die
# Verkuendung weiter. Der Bau verweigert sich, wenn Tag und
# manifest.json verschiedene Versionen nennen -- ein Release, der im
# Namen etwas anderes verspricht als er installiert, ist eine Falle.
auslieferung:
  stage: auslieferung
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - python auslieferung/release_bauen.py dist --version "${CI_COMMIT_TAG}"
    - |
      ZIP_NAME="hacs-lab-v${CI_COMMIT_TAG#v}.zip"
      ZIP_SHA=$(python -c "
      from pathlib import Path
      from auslieferung.release_bauen import fingerabdruck
      print(fingerabdruck(Path('dist') / '${ZIP_NAME}'))
      ")
      echo "ZIP_NAME=${ZIP_NAME}" >> url.env
      echo "ZIP_URL=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${ZIP_NAME}" >> url.env
      echo "ZIP_SHA=${ZIP_SHA}" >> url.env
  artifacts:
    paths:
      - dist/
    reports:
      dotenv: url.env
    expire_in: never

# verkuendigung traegt den Release ins GitLab ein -- der Bot-Weg ueber
# die release:-Syntax, mit dem Anhang-Link auf den Bau oben. Kann der
# Runner das release-cli-Image nicht ziehen, bleibt der ZIP trotzdem
# als Artefakt des Baus greifbar und die Eintragung ist ein API-Aufruf
# (POST /projects/:id/releases) den Biene oder Imker nachholen --
# Fingerabdruck und Adresse stehen dann in der Ausgabe des Baus.
verkuendigung:
  stage: auslieferung
  rules:
    - if: $CI_COMMIT_TAG
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: auslieferung
      artifacts: true
  before_script: []
  script:
    - echo "Verkuendung von ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "HACS*lab ${CI_COMMIT_TAG}"
    description: "Deterministischer Bau aus dem getaggten Stand. SHA-256 des Anhangs: ${ZIP_SHA}"
    assets:
      links:
        - name: "${ZIP_NAME} -- Hand-Installation"
          url: ${ZIP_URL}
