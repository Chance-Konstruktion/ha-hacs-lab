<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="HACS*lab Symbol: daemonischer GitLab-Fuchs uebernimmt das Home-Assistant-Haus">
  <!-- HACS*lab . Flug 2076: das weisse HA-Haus auf HA-Blau wird vom
       daemonischen GitLab-Fuchs besessen . Geometrie aus Flug 2075,
       Facetten in Nachtbraunen, Nahte in GitLab-Glut. Stern = das * im Namen. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FC4F8"/>
      <stop offset="0.52" stop-color="#03A9F4"/>
      <stop offset="1" stop-color="#01639E"/>
    </linearGradient>
    <linearGradient id="unheil" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#021B33" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#021B33" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#010609" stop-opacity="0.68"/>
      <stop offset="0.6" stop-color="#010609" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#010609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streifen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45121A"/>
      <stop offset="1" stop-color="#1A0609"/>
    </linearGradient>
    <linearGradient id="auge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF59D"/>
      <stop offset="1" stop-color="#FF3D00"/>
    </linearGradient>
    <radialGradient id="augenglut" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFAB00" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grinnen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9100"/>
      <stop offset="0.5" stop-color="#FFEA00"/>
      <stop offset="1" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="stern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Behaelter: abgerundetes Quadrat, Home-Assistant-Blau -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#grund)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#unheil)"/>

  <!-- Das weisse Home-Assistant-Haus (runde Ecken per Strich-Trick) -->
  <path d="M256,120 L398,250 L398,390 L114,390 L114,250 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>

  <!-- Risse: das Haus haelt dem Fuchs nicht stand -->
  <g fill="none" stroke="#082C4F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M240,178 L248,152 L242,134 L252,118"/>
    <path d="M272,178 L264,152 L270,134 L260,118"/>
    <path d="M200,322 L172,310 L182,330 L152,322"/>
    <path d="M312,322 L340,310 L330,330 L360,322"/>
    <path d="M228,352 L206,370 L214,386 L198,402"/>
    <path d="M284,352 L306,370 L298,386 L314,402"/>
  </g>
  <g fill="none" stroke="#082C4F" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M248,152 L236,147"/>
    <path d="M264,152 L276,147"/>
    <path d="M172,310 L162,300"/>
    <path d="M340,310 L350,300"/>
    <path d="M206,370 L214,358"/>
    <path d="M306,370 L298,358"/>
  </g>

  <!-- Aura der Besessenheit: um den Fuchs vergraupelt das Weiss -->
  <ellipse cx="256.0" cy="250.0" rx="195.0" ry="180.0" fill="url(#aura)"/>

  <!-- Daemonischer Fuchs: Feuerschein unter den Facetten -->
  <path d="M 175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9 Z" fill="none" stroke="#FF6D00" stroke-width="14" stroke-opacity="0.45" stroke-linejoin="round"/>
  <!-- Facetten in Nachtbraunen (Geometrie: Flug 2075) -->
  <polygon points="175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9" fill="#2E0D08"/>
  <polygon points="146.3,173.9 222.5,177.7 256.0,381.8 175.3,298.0" fill="#54220D"/>
  <polygon points="365.7,173.9 289.5,177.7 256.0,381.8 336.7,298.0" fill="#54220D"/>
  <polygon points="175.3,118.2 146.3,173.9 222.5,177.7" fill="#563610"/>
  <polygon points="336.7,118.2 365.7,173.9 289.5,177.7" fill="#563610"/>
  <polygon points="222.5,177.7 256.0,162.4 289.5,177.7 256.0,381.8" fill="url(#streifen)"/>
  <!-- Feuerlinie: heller Rand, damit der Fuchs vor Weiss und Aura steht -->
  <path d="M 175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9 Z" fill="none" stroke="#FFB300" stroke-width="4" stroke-opacity="0.9" stroke-linejoin="round"/>

  <!-- Gluehende Nahte in GitLab-Farben (weiche Glut darunter) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222.5 177.7 L 256.0 162.4 L 289.5 177.7" stroke="#FFB300" stroke-width="14" opacity="0.3"/>
    <path d="M 175.3 118.2 L 222.5 177.7" stroke="#FFB300" stroke-width="11" opacity="0.25"/>
    <path d="M 336.7 118.2 L 289.5 177.7" stroke="#FFB300" stroke-width="11" opacity="0.25"/>
    <path d="M 222.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="13" opacity="0.3"/>
    <path d="M 289.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="13" opacity="0.3"/>
    <path d="M 256.0 162.4 L 256.0 381.8" stroke="#E24329" stroke-width="10" opacity="0.25"/>
  </g>
  <!-- Gluehende Nahte (Kern) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222.5 177.7 L 256.0 162.4 L 289.5 177.7" stroke="#FCA326" stroke-width="6" opacity="0.95"/>
    <path d="M 175.3 118.2 L 222.5 177.7" stroke="#FCA326" stroke-width="5" opacity="0.85"/>
    <path d="M 336.7 118.2 L 289.5 177.7" stroke="#FCA326" stroke-width="5" opacity="0.85"/>
    <path d="M 222.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="6" opacity="0.95"/>
    <path d="M 289.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="6" opacity="0.95"/>
    <path d="M 256.0 162.4 L 256.0 381.8" stroke="#E24329" stroke-width="4.5" opacity="0.7"/>
  </g>

  <!-- Brennende Augen -->
  <ellipse cx="219.4" cy="244.4" rx="34" ry="22" fill="url(#augenglut)"/>
  <ellipse cx="292.6" cy="244.4" rx="34" ry="22" fill="url(#augenglut)"/>
  <ellipse cx="219.4" cy="244.4" rx="24.5" ry="11.5" transform="rotate(32 219.4 244.4)" fill="url(#auge)"/>
  <ellipse cx="292.6" cy="244.4" rx="24.5" ry="11.5" transform="rotate(-32 292.6 244.4)" fill="url(#auge)"/>

  <!-- Zaehnesaegiges Grinsen -->
  <path d="M206,320 L228,320 L240,338 L256,320 L272,338 L284,320 L306,320" fill="none" stroke="#FF6D00" stroke-width="15" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206,320 L228,320 L240,338 L256,320 L272,338 L284,320 L306,320" fill="none" stroke="url(#grinnen)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Truemmer vor der Fassade -->
  <g fill="#FFFFFF" stroke="#BFE6FF" stroke-width="3" stroke-linejoin="round">
    <path d="M118,160 L146,150 L138,180 Z"/>
    <path d="M394,160 L366,150 L374,180 Z"/>
  </g>

  <!-- Funkelstern: das Sternchen aus HACS*lab -->
  <path d="M 424.0 66.0 q 5 21 26 26 q -21 5 -26 26 q -5 -21 -26 -26 q 21 -5 26 -26 Z" fill="url(#stern)"/>

  <!-- Randpolitur -->
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
</svg>
