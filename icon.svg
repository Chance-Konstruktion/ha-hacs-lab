<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="HACS*lab Symbol: daemonischer GitLab-Fuchs uebernimmt das Home-Assistant-Haus">
  <!-- HACS*lab . Flug 2078: das weisse HA-Haus auf HA-Blau wird vom
       daemonischen GitLab-Fuchs besessen und umkrallt . Geometrie aus
       Flug 2075, Facetten in Glutfarben, Nahte in GitLab-Glut,
       Klauen bohren sich in die Fassade. Stern = das * im Namen. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FC4F8"/>
      <stop offset="0.52" stop-color="#03A9F4"/>
      <stop offset="1" stop-color="#01639E"/>
    </linearGradient>
    <linearGradient id="unheil" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#021B33" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#021B33" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#010609" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#010609" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#010609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streifen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1A08"/>
      <stop offset="1" stop-color="#2A0603"/>
    </linearGradient>
    <linearGradient id="auge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="1" stop-color="#FF3D00"/>
    </linearGradient>
    <radialGradient id="augenglut" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFAB00" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grinnen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9100"/>
      <stop offset="0.5" stop-color="#FFEA00"/>
      <stop offset="1" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="stern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Behaelter: abgerundetes Quadrat, Home-Assistant-Blau -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#grund)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#unheil)"/>

  <!-- Das weisse Home-Assistant-Haus (runde Ecken per Strich-Trick) -->
  <path d="M256,120 L398,250 L398,390 L114,390 L114,250 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>

  <!-- Risse mit Tiefenwirkung (Halo, Kante, Kern): die Fassade bricht wirklich auf -->
  <g fill="none" stroke="#082C4F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.2">
    <path d="M240,178 L248,152 L242,134 L252,118"/>
    <path d="M272,178 L264,152 L270,134 L260,118"/>
    <path d="M200,322 L172,310 L182,330 L152,322"/>
    <path d="M312,322 L340,310 L330,330 L360,322"/>
    <path d="M228,352 L206,370 L214,386 L198,402"/>
    <path d="M284,352 L306,370 L298,386 L314,402"/>
  </g>
  <g fill="none" stroke="#082C4F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M240,178 L248,152 L242,134 L252,118"/>
    <path d="M272,178 L264,152 L270,134 L260,118"/>
    <path d="M200,322 L172,310 L182,330 L152,322"/>
    <path d="M312,322 L340,310 L330,330 L360,322"/>
    <path d="M228,352 L206,370 L214,386 L198,402"/>
    <path d="M284,352 L306,370 L298,386 L314,402"/>
  </g>
  <g fill="none" stroke="#082C4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M240,178 L248,152 L242,134 L252,118"/>
    <path d="M272,178 L264,152 L270,134 L260,118"/>
    <path d="M200,322 L172,310 L182,330 L152,322"/>
    <path d="M312,322 L340,310 L330,330 L360,322"/>
    <path d="M228,352 L206,370 L214,386 L198,402"/>
    <path d="M284,352 L306,370 L298,386 L314,402"/>
  </g>
  <g fill="none" stroke="#082C4F" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
    <path d="M248,152 L236,147"/>
    <path d="M264,152 L276,147"/>
    <path d="M172,310 L162,300"/>
    <path d="M340,310 L350,300"/>
    <path d="M206,370 L214,358"/>
    <path d="M306,370 L298,358"/>
  </g>

  <!-- Aura der Besessenheit: um den Fuchs vergraupelt das Weiss -->
  <ellipse cx="256.0" cy="250.0" rx="195.0" ry="180.0" fill="url(#aura)"/>

  <!-- Daemonischer Fuchs: Feuerschein unter den Facetten -->
  <path d="M 175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9 Z" fill="none" stroke="#FF6D00" stroke-width="14" stroke-opacity="0.45" stroke-linejoin="round"/>
  <!-- Facetten in Nachtbraunen (Geometrie: Flug 2075) -->
  <polygon points="175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9" fill="#4A0E06"/>
  <polygon points="146.3,173.9 222.5,177.7 256.0,381.8 175.3,298.0" fill="#CC4E12"/>
  <polygon points="365.7,173.9 289.5,177.7 256.0,381.8 336.7,298.0" fill="#CC4E12"/>
  <polygon points="175.3,118.2 146.3,173.9 222.5,177.7" fill="#DE8C1E"/>
  <polygon points="336.7,118.2 365.7,173.9 289.5,177.7" fill="#DE8C1E"/>
  <polygon points="222.5,177.7 256.0,162.4 289.5,177.7 256.0,381.8" fill="url(#streifen)"/>
  <!-- Feuerlinie: dunkler Kontur (Silhouette trennt sich auch klein
       vom Weiss) mit Glutkern darueber -->
  <path d="M 175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9 Z" fill="none" stroke="#1A0402" stroke-width="7" stroke-opacity="0.75" stroke-linejoin="round"/>
  <path d="M 175.3,118.2 222.5,177.7 256.0,162.4 289.5,177.7 336.7,118.2 365.7,173.9 336.7,298.0 256.0,381.8 175.3,298.0 146.3,173.9 Z" fill="none" stroke="#FFB300" stroke-width="3.5" stroke-opacity="0.95" stroke-linejoin="round"/>

  <!-- Gluehende Nahte in GitLab-Farben (weiche Glut darunter, schmal:
       sonst verschmiert sie im Kleinen das Gesicht) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222.5 177.7 L 256.0 162.4 L 289.5 177.7" stroke="#FFB300" stroke-width="10" opacity="0.2"/>
    <path d="M 175.3 118.2 L 222.5 177.7" stroke="#FFB300" stroke-width="8" opacity="0.18"/>
    <path d="M 336.7 118.2 L 289.5 177.7" stroke="#FFB300" stroke-width="8" opacity="0.18"/>
    <path d="M 222.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="9" opacity="0.2"/>
    <path d="M 289.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="9" opacity="0.2"/>
    <path d="M 256.0 162.4 L 256.0 381.8" stroke="#E24329" stroke-width="7" opacity="0.18"/>
  </g>
  <!-- Gluehende Nahte (Kern, breit genug fuer 128 px) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222.5 177.7 L 256.0 162.4 L 289.5 177.7" stroke="#FCA326" stroke-width="8" opacity="0.95"/>
    <path d="M 175.3 118.2 L 222.5 177.7" stroke="#FCA326" stroke-width="7" opacity="0.85"/>
    <path d="M 336.7 118.2 L 289.5 177.7" stroke="#FCA326" stroke-width="7" opacity="0.85"/>
    <path d="M 222.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="8" opacity="0.95"/>
    <path d="M 289.5 177.7 L 256.0 381.8" stroke="#FC6D26" stroke-width="8" opacity="0.95"/>
    <path d="M 256.0 162.4 L 256.0 381.8" stroke="#E24329" stroke-width="6.5" opacity="0.7"/>
  </g>

  <!-- Brennende Augen -->
  <ellipse cx="219.4" cy="244.4" rx="36" ry="24" fill="url(#augenglut)"/>
  <ellipse cx="292.6" cy="244.4" rx="36" ry="24" fill="url(#augenglut)"/>
  <ellipse cx="219.4" cy="244.4" rx="24.5" ry="13" transform="rotate(32 219.4 244.4)" fill="url(#auge)"/>
  <ellipse cx="292.6" cy="244.4" rx="24.5" ry="13" transform="rotate(-32 292.6 244.4)" fill="url(#auge)"/>

  <!-- Zaehnesaegiges Grinsen -->
  <path d="M206,320 L228,320 L240,338 L256,320 L272,338 L284,320 L306,320" fill="none" stroke="#FF6D00" stroke-width="9" opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206,320 L228,320 L240,338 L256,320 L272,338 L284,320 L306,320" fill="none" stroke="url(#grinnen)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Klauen: der Fuchs krallt sich ins weisse Haus (Feuerschein darunter) -->
  <g fill="none" stroke="#FF6D00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.15">
    <path d="M 172 250 C 148 254, 124 272, 118 300 L 116 322 L 128 312 C 134 288, 150 274, 164 270 Z"/>
    <path d="M 176 266 C 148 268, 120 294, 112 330 L 112 352 L 124 341 C 132 314, 148 300, 168 294 Z"/>
    <path d="M 192 296 C 160 302, 130 328, 122 362 L 120 388 L 134 376 C 140 350, 162 330, 198 316 Z"/>
    <path d="M 340 250 C 364 254, 388 272, 394 300 L 396 322 L 384 312 C 378 288, 362 274, 348 270 Z"/>
    <path d="M 336 266 C 364 268, 392 294, 400 330 L 400 352 L 388 341 C 380 314, 364 300, 344 294 Z"/>
    <path d="M 320 296 C 352 302, 382 328, 390 362 L 392 388 L 378 376 C 372 350, 350 330, 314 316 Z"/>
  </g>
  <g fill="#240602" stroke="#FFB300" stroke-width="3" stroke-opacity="0.9" stroke-linejoin="round">
    <path d="M 172 250 C 148 254, 124 272, 118 300 L 116 322 L 128 312 C 134 288, 150 274, 164 270 Z"/>
    <path d="M 176 266 C 148 268, 120 294, 112 330 L 112 352 L 124 341 C 132 314, 148 300, 168 294 Z"/>
    <path d="M 192 296 C 160 302, 130 328, 122 362 L 120 388 L 134 376 C 140 350, 162 330, 198 316 Z"/>
    <path d="M 340 250 C 364 254, 388 272, 394 300 L 396 322 L 384 312 C 378 288, 362 274, 348 270 Z"/>
    <path d="M 336 266 C 364 268, 392 294, 400 330 L 400 352 L 388 341 C 380 314, 364 300, 344 294 Z"/>
    <path d="M 320 296 C 352 302, 382 328, 390 362 L 392 388 L 378 376 C 372 350, 350 330, 314 316 Z"/>
  </g>
  <g fill="none" stroke="#082C4F" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 116 320 L 128 314"/>
    <path d="M 116 320 L 122 334"/>
    <path d="M 112 350 L 124 344"/>
    <path d="M 112 350 L 120 364"/>
    <path d="M 120 386 L 132 380"/>
    <path d="M 120 386 L 126 394"/>
    <path d="M 396 320 L 384 314"/>
    <path d="M 396 320 L 390 334"/>
    <path d="M 400 350 L 388 344"/>
    <path d="M 400 350 L 392 364"/>
    <path d="M 392 386 L 380 380"/>
    <path d="M 392 386 L 386 394"/>
  </g>

  <!-- Funkelstern: das Sternchen aus HACS*lab -->
  <path d="M 424.0 64.0 q 6 23 28 28 q -23 6 -28 28 q -6 -23 -28 -28 q 23 -6 28 -28 Z" fill="url(#stern)"/>

  <!-- Randpolitur -->
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
</svg>
