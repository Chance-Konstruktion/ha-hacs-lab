<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="HACS*lab Symbol: GitLab-Fuchs auf HACS-Purpur mit Funkelstern">
  <!-- HACS*lab . Marken-Mix: GitLab-Fuchs (Silhouette, Farben) auf
       HACS-Purpur-Quadrat; der Mittelstreifen mischt Lila zu Rot;
       der Stern ist das Sternchen aus dem Namen. Flug 2075. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A467FF"/>
      <stop offset="1" stop-color="#6B35D9"/>
    </linearGradient>
    <linearGradient id="streifen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2ACFF"/>      <stop offset="0.45" stop-color="#B053C8"/>      <stop offset="1" stop-color="#E24329"/>
    </linearGradient>
    <linearGradient id="stern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Behaelter: abgerundetes Quadrat, HACS-Purpur -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#grund)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Fuchs: Silhouette (GitLab-Rot) -->
  <polygon points="137.3,60.4 206.7,147.8 256.0,125.4 305.3,147.8 374.7,60.4 417.3,142.2 374.7,324.7 256.0,447.9 137.3,324.7 94.7,142.2" fill="#E24329"/>
  <!-- Wangen-Facetten (GitLab-Orange) -->
  <polygon points="94.7,142.2 206.7,147.8 256.0,447.9 137.3,324.7" fill="#FC6D26"/>
  <polygon points="417.3,142.2 305.3,147.8 256.0,447.9 374.7,324.7" fill="#FC6D26"/>
  <!-- Ohren (GitLab-Gelb) -->
  <polygon points="137.3,60.4 94.7,142.2 206.7,147.8" fill="#FCA326"/>
  <polygon points="374.7,60.4 417.3,142.2 305.3,147.8" fill="#FCA326"/>
  <!-- Mittelstreifen: HACS-Lila fliesst zu GitLab-Rot -->
  <polygon points="206.7,147.8 256.0,125.4 305.3,147.8 256.0,447.9" fill="url(#streifen)"/>

  <!-- Mandel-Augen -->
  <ellipse cx="170.9" cy="243.0" rx="36" ry="15.5" transform="rotate(32 170.9 243.0)" fill="#FFFFFF"/>
  <ellipse cx="341.1" cy="243.0" rx="36" ry="15.5" transform="rotate(-32 341.1 243.0)" fill="#FFFFFF"/>

  <!-- Funkelstern: das Sternchen aus HACS*lab -->
  <path d="M 414.7 56.5 q 6 25 31 31 q -25 6 -31 31 q -6 -25 -31 -31 q 25 -6 31 -31 Z" fill="url(#stern)"/>
</svg>
